<section class="container">
    <h1>Characters</h1>

    <div class="grid">
        @for (character of characters(); track $index) {
            <app-character-card
                [character]='character'>
            </app-character-card>
        }
    </div>

    <div class="pagination">
        <button 
            (click)="prevPage()"
            [disabled]="!hasPrev()">
            Anterior
        </button>

        <button 
            (click)="nextPage()" 
            [disabled]="!hasNext()">
            Siguiente
        </button>
    </div>

</section>
